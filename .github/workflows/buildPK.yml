
name: Build Jee OS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Jee OS project
        id: locate
        shell: bash
        run: |
          if [ -f "package.json" ]; then
            APP_DIR="."
          elif [ -f "Jee OS/package.json" ]; then
            APP_DIR="Jee OS"
          else
            echo "ERROR: Could not find the Jee OS package.json."
            echo "Put this workflow at the repository root."
            exit 1
          fi

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "Using project directory: $APP_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: npm install

      - name: Prepare web assets and Capacitor config
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          set -euo pipefail

          for file in index.html app.js tracker.json playlist-durations.json; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file missing: $file"
              exit 1
            fi
          done

          rm -rf www
          mkdir -p www

          cp index.html app.js tracker.json playlist-durations.json www/

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.saransh.jeeos",
            "appName": "Jee OS",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Generate Android project if needed
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: npx cap sync android

      - name: Verify Gradle wrapper
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          if [ ! -f android/gradlew ]; then
            echo "ERROR: Android Gradle wrapper was not generated."
            exit 1
          fi
          chmod +x android/gradlew

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.app_dir }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jee-OS-debug-apk
          path: ${{ steps.locate.outputs.app_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
